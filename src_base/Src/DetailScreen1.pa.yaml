            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =88
            Size: =27
            Text: ="Productos"
            Width: =Parent.Width - Self.X - IconDelete1.Width - IconEdit1.Width
            Wrap: =false
            X: =IconBackarrow1.X + IconBackarrow1.Width
