# ************************************************************************************************
# Canvas App Screen: scrDashboard (Change Management eBFactory)
# ************************************************************************************************
Screens:
  scrDashboard:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
      LoadingSpinnerColor: =RGBA(0, 43, 127, 1)
      OnVisible: =Refresh([@'Solicitudes de Cambios'])
    Children:
      - conMainLayout:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width
          Children:
            - conSidebar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(0, 43, 127, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  PaddingBottom: =24
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =24
                  Width: =260
                Children:
                  - lblBrandTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Size: =18
                        Text: ="eBFactory"
                  - lblBrandSub:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.7)
                        Font: =Font.'Segoe UI'
                        Height: =20
                        Size: =12
                        Text: ="Control de Cambios"
                  - conDivider1:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(255, 255, 255, 0.15)
                        Height: =1
                        Width: =Parent.Width - 40
                  - btnNavDashboard:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(130, 195, 65, 1)
                        Fill: =RGBA(130, 195, 65, 0.2)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="📊 Inicio / Dashboard"
                        Width: =Parent.Width - 40
                  - btnNavNueva:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.85)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrNuevaSolicitud, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="➕ Nueva Solicitud"
                        Width: =Parent.Width - 40
                  - btnNavMisSol:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.85)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrMisSolicitudes, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="📋 Mis Solicitudes"
                        Width: =Parent.Width - 40
                  - btnNavCierre:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.85)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrEjecucionYCierre, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="✅ Ejecución y Cierre"
                        Width: =Parent.Width - 40
                  - conUserInfo:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 0.08)
                        Height: =60
                        LayoutDirection: =LayoutDirection.Vertical
                        PaddingBottom: =8
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width - 40
                      Children:
                        - lblUserName:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Size: =12
                              Text: =User().FullName
                        - lblUserEmail:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(255, 255, 255, 0.6)
                              Font: =Font.'Segoe UI'
                              Size: =10
                              Text: =User().Email
            - conWorkArea:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(245, 247, 250, 1)
                  FillPortions: =1
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =20
                  PaddingBottom: =24
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =24
                Children:
                  - conHeader:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =70
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        PaddingLeft: =20
                        PaddingRight: =20
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - lblHeaderTitle:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(0, 43, 127, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Size: =20
                              Text: ="Panel de Control de Cambios"
                  - conKPIContainer:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Height: =110
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                        Width: =Parent.Width
                      Children:
                        - conKPiPendientes:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Height: =110
                              LayoutDirection: =LayoutDirection.Vertical
                              PaddingLeft: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - lblKPiPendLabel:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(107, 114, 128, 1)
                                    Font: =Font.'Segoe UI'
                                    Size: =13
                                    Text: ="Pendientes"
                              - lblKpiPendVal:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(201, 162, 39, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Size: =28
                                    Text: =Text(CountRows(Filter([@'Solicitudes de Cambios'], Estado_Aprobacion.Value = "Pendiente")))
                        - conKPiAprobadas:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Height: =110
                              LayoutDirection: =LayoutDirection.Vertical
                              PaddingLeft: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - lblKPiAprobLabel:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(107, 114, 128, 1)
                                    Font: =Font.'Segoe UI'
                                    Size: =13
                                    Text: ="Aprobadas"
                              - lblKpiAprobVal:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(130, 195, 65, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Size: =28
                                    Text: =Text(CountRows(Filter([@'Solicitudes de Cambios'], Estado_Aprobacion.Value = "Aprobado")))
                        - conKPiRechazadas:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Height: =110
                              LayoutDirection: =LayoutDirection.Vertical
                              PaddingLeft: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - lblKPiRechLabel:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(107, 114, 128, 1)
                                    Font: =Font.'Segoe UI'
                                    Size: =13
                                    Text: ="Rechazadas"
                              - lblKpiRechVal:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(214, 69, 69, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Size: =28
                                    Text: =Text(CountRows(Filter([@'Solicitudes de Cambios'], Estado_Aprobacion.Value = "Rechazado")))
                        - conKPiCerradas:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Height: =110
                              LayoutDirection: =LayoutDirection.Vertical
                              PaddingLeft: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - lblKPiCerrLabel:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(107, 114, 128, 1)
                                    Font: =Font.'Segoe UI'
                                    Size: =13
                                    Text: ="Cerradas"
                              - lblKpiCerrVal:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(107, 114, 128, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Size: =28
                                    Text: =Text(CountRows(Filter([@'Solicitudes de Cambios'], Estado_Aprobacion.Value = "Cerrado")))
                  - conMovimientosCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        PaddingBottom: =16
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =16
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - lblMovTitle:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(0, 43, 127, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =30
                              Size: =16
                              Text: ="Últimos Movimientos de Cambios"
                        - galUltimosMovimientos:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_ThreeTextVariant_ver5.0
                            Properties:
                              DelayItemLoading: =true
                              Height: =380
                              Items: =FirstN(SortByColumns([@'Solicitudes de Cambios'], "Modified", SortOrder.Descending), 10)
                              LoadingSpinner: =LoadingSpinner.Data
                              TemplatePadding: =8
                              TemplateSize: =70
                              Width: =Parent.Width - 40
                            Children:
                              - lblItemTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(31, 41, 55, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =14
                                    Text: =ThisItem.Title
                                    X: =12
                                    Y: =10
                              - lblItemSubtitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(107, 114, 128, 1)
                                    Font: =Font.'Segoe UI'
                                    Size: =12
                                    Text: ="CHG-" & ThisItem.ID & " · " & ThisItem.Tipo_Cambio.Value & " · " & ThisItem.Categoria_Cambio.Value
                                    X: =12
                                    Y: =34
                              - lblItemStateChip:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: |-
                                      =Switch(
                                        ThisItem.Estado_Aprobacion.Value,
                                        "Pendiente", RGBA(146, 110, 20, 1),
                                        "Aprobado", RGBA(22, 101, 52, 1),
                                        "Rechazado", RGBA(153, 27, 27, 1),
                                        RGBA(107, 114, 128, 1)
                                      )
                                    Fill: |-
                                      =Switch(
                                        ThisItem.Estado_Aprobacion.Value,
                                        "Pendiente", RGBA(253, 230, 138, 0.5),
                                        "Aprobado", RGBA(187, 247, 208, 0.5),
                                        "Rechazado", RGBA(254, 202, 202, 0.5),
                                        RGBA(243, 244, 246, 1)
                                      )
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    Size: =12
                                    Text: =ThisItem.Estado_Aprobacion.Value
                                    Width: =110
                                    X: =Parent.TemplateWidth - 130
                                    Y: =20
