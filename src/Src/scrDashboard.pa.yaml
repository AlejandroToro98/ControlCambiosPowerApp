# ************************************************************************************************
# Canvas App Screen Base: scrDashboard
# ************************************************************************************************
Screens:
  scrDashboard:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
      LoadingSpinnerColor: =RGBA(0, 43, 127, 1)
      OnVisible: =Refresh([@'Solicitudes de Cambios'])
    Children:
      - conMainLayout:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width
          Children:
            - conSidebar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(0, 43, 127, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  PaddingBottom: =24
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =24
                  Width: =260
                Children:
                  - btnNavDashboard:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(130, 195, 65, 1)
                        Fill: =RGBA(255, 255, 255, 0.12)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Inicio / Dashboard"
                        Width: =Parent.Width - 32
                  - btnNavNueva:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrNuevaSolicitud, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Nueva Solicitud"
                        Width: =Parent.Width - 32
                  - btnNavMisSol:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrMisSolicitudes, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Mis Solicitudes"
                        Width: =Parent.Width - 32
                  - btnNavCierre:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrEjecucionYCierre, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Ejecución y Cierre"
                        Width: =Parent.Width - 32
            - conWorkArea:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(245, 247, 250, 1)
                  FillPortions: =1
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =20
                  PaddingBottom: =24
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =24
                Children:
                  - conHeader:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Height: =60
                        LayoutDirection: =LayoutDirection.Vertical
                      Children:
                        - lblHeaderTitle:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(0, 43, 127, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Size: =22
                              Text: ="Dashboard"
                  - conHeroBanner:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(0, 31, 92, 1)
                        Height: =140
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        PaddingBottom: =20
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =20
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                      Children:
                        - conHeroButtons:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Height: =44
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                            Children:
                              - btnHeroNuevo:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Color: =RGBA(31, 41, 55, 1)
                                    Fill: =RGBA(130, 195, 65, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =42
                                    OnSelect: =Navigate(scrNuevaSolicitud, ScreenTransition.Fade)
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Text: ="Nueva Solicitud"
                                    Width: =160
                              - btnHeroMisSol:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =RGBA(0, 31, 92, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =42
                                    OnSelect: =Navigate(scrMisSolicitudes, ScreenTransition.Fade)
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Text: ="Mis Solicitudes"
                                    Width: =150
                              - btnHeroCierre:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =RGBA(0, 31, 92, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =42
                                    OnSelect: =Navigate(scrEjecucionYCierre, ScreenTransition.Fade)
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Text: ="Ejecución y Cierre"
                                    Width: =160
                  - conKPIContainer:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Height: =100
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                        Width: =Parent.Width
                      Children:
                        - conKPiPendientes:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(228, 232, 240, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Height: =100
                              LayoutDirection: =LayoutDirection.Vertical
                              PaddingLeft: =20
                              PaddingTop: =16
                              RadiusBottomLeft: =16
                              RadiusBottomRight: =16
                              RadiusTopLeft: =16
                              RadiusTopRight: =16
                            Children:
                              - lblKpiPendVal:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(0, 43, 127, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Size: =28
                                    Text: =Text(CountRows(Filter([@'Solicitudes de Cambios'], Estado_Aprobacion.Value = "Pendiente")))
                        - conKPiAprobadas:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(228, 232, 240, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Height: =100
                              LayoutDirection: =LayoutDirection.Vertical
                              PaddingLeft: =20
                              PaddingTop: =16
                              RadiusBottomLeft: =16
                              RadiusBottomRight: =16
                              RadiusTopLeft: =16
                              RadiusTopRight: =16
                            Children:
                              - lblKpiAprobVal:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(0, 43, 127, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Size: =28
                                    Text: =Text(CountRows(Filter([@'Solicitudes de Cambios'], Estado_Aprobacion.Value = "Aprobado")))
                        - conKPiRechazadas:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(228, 232, 240, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Height: =100
                              LayoutDirection: =LayoutDirection.Vertical
                              PaddingLeft: =20
                              PaddingTop: =16
                              RadiusBottomLeft: =16
                              RadiusBottomRight: =16
                              RadiusTopLeft: =16
                              RadiusTopRight: =16
                            Children:
                              - lblKpiRechVal:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(0, 43, 127, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Size: =28
                                    Text: =Text(CountRows(Filter([@'Solicitudes de Cambios'], Estado_Aprobacion.Value = "Rechazado")))
                        - conKPiCerradas:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(228, 232, 240, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Height: =100
                              LayoutDirection: =LayoutDirection.Vertical
                              PaddingLeft: =20
                              PaddingTop: =16
                              RadiusBottomLeft: =16
                              RadiusBottomRight: =16
                              RadiusTopLeft: =16
                              RadiusTopRight: =16
                            Children:
                              - lblKpiCerrVal:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(0, 43, 127, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Size: =28
                                    Text: =Text(CountRows(Filter([@'Solicitudes de Cambios'], Estado_Aprobacion.Value = "Cerrado")))
                  - conMovimientosCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(228, 232, 240, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        PaddingBottom: =20
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =20
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                      Children:
                        - galUltimosMovimientos:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_ThreeTextVariant_ver5.0
                            Properties:
                              DelayItemLoading: =true
                              Height: =320
                              Items: =FirstN(SortByColumns([@'Solicitudes de Cambios'], "Modified", SortOrder.Descending), 10)
                              LoadingSpinner: =LoadingSpinner.Data
                              TemplatePadding: =4
                              TemplateSize: =65
                              Width: =Parent.Width - 48
                            Children:
                              - lblItemTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(31, 41, 55, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Size: =14
                                    Text: =ThisItem.Title
                                    X: =12
                                    Y: =10
                              - lblItemStateChip:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: |-
                                      =Switch(
                                        ThisItem.Estado_Aprobacion.Value,
                                        "Pendiente", RGBA(146, 110, 20, 1),
                                        "Aprobado", RGBA(78, 131, 32, 1),
                                        "Rechazado", RGBA(178, 42, 42, 1),
                                        RGBA(107, 114, 128, 1)
                                      )
                                    Fill: |-
                                      =Switch(
                                        ThisItem.Estado_Aprobacion.Value,
                                        "Pendiente", RGBA(201, 162, 39, 0.15),
                                        "Aprobado", RGBA(130, 195, 65, 0.15),
                                        "Rechazado", RGBA(214, 69, 69, 0.15),
                                        RGBA(243, 244, 246, 1)
                                      )
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =26
                                    Size: =12
                                    Text: =ThisItem.Estado_Aprobacion.Value
                                    Width: =100
                                    X: =Parent.TemplateWidth - 120
                                    Y: =18
