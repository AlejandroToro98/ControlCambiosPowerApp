# ************************************************************************************************
# Canvas App Screen: scrNuevaSolicitud (Change Management eBFactory)
# ************************************************************************************************
Screens:
  scrNuevaSolicitud:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
      LoadingSpinnerColor: =RGBA(0, 43, 127, 1)
    Children:
      - conMainLayout2:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width
          Children:
            - conSidebar2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(0, 43, 127, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  PaddingBottom: =24
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =24
                  Width: =260
                Children:
                  - lblBrandTitle2:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Size: =18
                        Text: ="eBFactory"
                  - lblBrandSub2:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.7)
                        Font: =Font.'Segoe UI'
                        Height: =20
                        Size: =12
                        Text: ="Control de Cambios"
                  - conDivider2:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(255, 255, 255, 0.15)
                        Height: =1
                        Width: =Parent.Width - 40
                  - btnNavDashboard2:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.85)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrDashboard, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="📊 Inicio / Dashboard"
                        Width: =Parent.Width - 40
                  - btnNavNueva2:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(130, 195, 65, 1)
                        Fill: =RGBA(130, 195, 65, 0.2)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="➕ Nueva Solicitud"
                        Width: =Parent.Width - 40
                  - btnNavMisSol2:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.85)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrMisSolicitudes, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="📋 Mis Solicitudes"
                        Width: =Parent.Width - 40
                  - btnNavCierre2:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.85)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrEjecucionYCierre, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="✅ Ejecución y Cierre"
                        Width: =Parent.Width - 40
            - conWorkArea2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(245, 247, 250, 1)
                  FillPortions: =1
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =20
                  PaddingBottom: =24
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =24
                Children:
                  - conHeader2:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =70
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        PaddingLeft: =20
                        PaddingRight: =20
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - lblHeaderTitle2:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(0, 43, 127, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Size: =20
                              Text: ="Nueva Solicitud de Cambio"
                  - conFormContainer:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        PaddingBottom: =24
                        PaddingLeft: =28
                        PaddingRight: =28
                        PaddingTop: =24
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - lblNombreLabel:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(31, 41, 55, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Size: =13
                              Text: ="Nombre o Resumen del Cambio *"
                        - txtNombre:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =RGBA(228, 232, 240, 1)
                              Height: =40
                              HintText: '="Ej: Migración de base de datos a alta disponibilidad"'
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Width: =Parent.Width - 56
                        - lblTipoLabel:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(31, 41, 55, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Size: =13
                              Text: ="Tipo de Cambio *"
                        - ddTipo:
                            Control: Classic/Dropdown@2.3.1
                            Properties:
                              BorderColor: =RGBA(228, 232, 240, 1)
                              Height: =40
                              Items: =Choices([@'Solicitudes de Cambios'].Tipo_Cambio)
                              Width: =Parent.Width - 56
                        - lblCategoriaLabel:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(31, 41, 55, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Size: =13
                              Text: ="Categoría / SLA *"
                        - ddCategoria:
                            Control: Classic/Dropdown@2.3.1
                            Properties:
                              BorderColor: =RGBA(228, 232, 240, 1)
                              Height: =40
                              Items: =Choices([@'Solicitudes de Cambios'].Categoria_Cambio)
                              Width: =Parent.Width - 56
                        - lblJustificacionLabel:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(31, 41, 55, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Size: =13
                              Text: ="Justificación del Cambio *"
                        - txtJustificacion:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =RGBA(228, 232, 240, 1)
                              Height: =80
                              HintText: ="Explica la necesidad y motivo del cambio..."
                              Mode: =TextMode.MultiLine
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Width: =Parent.Width - 56
                        - conSeccionTecnica:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              Visible: =Not(ddTipo.Selected.Value in ["Estructura organizacional", "Cumplimiento regulatorio"])
                              Width: =Parent.Width - 56
                            Children:
                              - lblAlcanceLabel:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(31, 41, 55, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =13
                                    Text: ="Alcance y Sistemas Afectados"
                              - txtAlcance:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    BorderColor: =RGBA(228, 232, 240, 1)
                                    Height: =60
                                    Mode: =TextMode.MultiLine
                                    Width: =Parent.Width
                              - lblRiesgosLabel:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(31, 41, 55, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =13
                                    Text: ="Riesgos Identificados y Plan de Mitigación"
                              - txtRiesgos:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    BorderColor: =RGBA(228, 232, 240, 1)
                                    Height: =60
                                    Mode: =TextMode.MultiLine
                                    Width: =Parent.Width
                        - btnEnviarSolicitud:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(130, 195, 65, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =46
                              OnSelect: |-
                                =If(
                                  IsBlank(txtNombre.Text) || IsBlank(txtJustificacion.Text) || IsBlank(ddTipo.Selected.Value),
                                  Notify("Completa los campos obligatorios antes de enviar", NotificationType.Error),
                                  Set(
                                    varRegistro,
                                    Patch(
                                      [@'Solicitudes de Cambios'],
                                      Defaults([@'Solicitudes de Cambios']),
                                      {
                                        Title: txtNombre.Text,
                                        Tipo_Cambio: { Value: ddTipo.Selected.Value },
                                        Justificacion: txtJustificacion.Text,
                                        Categoria_Cambio: { Value: ddCategoria.Selected.Value },
                                        Alcance: txtAlcance.Text,
                                        Riesgos_Identificados: txtRiesgos.Text,
                                        Solicitante: {
                                          '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                          Claims: "i:0#.f|membership|" & User().Email,
                                          DisplayName: User().FullName,
                                          Email: User().Email,
                                          Department: "",
                                          JobTitle: "",
                                          Picture: ""
                                        },
                                        Estado_Aprobacion: { Value: "Pendiente" }
                                      }
                                    )
                                  );
                                  Notify("Solicitud CHG-" & varRegistro.ID & " enviada a aprobación correctamente", NotificationType.Success);
                                  Navigate(scrMisSolicitudes, ScreenTransition.Fade)
                                )
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Text: ="🚀 Enviar a Aprobación"
                              Width: =220
