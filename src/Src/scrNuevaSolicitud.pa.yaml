# ************************************************************************************************
# Canvas App Screen Base: scrNuevaSolicitud
# ************************************************************************************************
Screens:
  scrNuevaSolicitud:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
      LoadingSpinnerColor: =RGBA(0, 43, 127, 1)
    Children:
      - conMainLayout2:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width
          Children:
            - conSidebar2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(0, 43, 127, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  PaddingBottom: =24
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =24
                  Width: =260
                Children:
                  - btnNavDashboard2:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrDashboard, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Inicio / Dashboard"
                        Width: =Parent.Width - 32
                  - btnNavNueva2:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(130, 195, 65, 1)
                        Fill: =RGBA(255, 255, 255, 0.12)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Nueva Solicitud"
                        Width: =Parent.Width - 32
                  - btnNavMisSol2:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrMisSolicitudes, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Mis Solicitudes"
                        Width: =Parent.Width - 32
                  - btnNavCierre2:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrEjecucionYCierre, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Ejecución y Cierre"
                        Width: =Parent.Width - 32
            - conWorkArea2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(245, 247, 250, 1)
                  FillPortions: =1
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  PaddingBottom: =24
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =24
                Children:
                  - conFormCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(228, 232, 240, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =14
                        PaddingBottom: =24
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =20
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                      Children:
                        - txtNombre:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =RGBA(228, 232, 240, 1)
                              Height: =40
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =Parent.Width - 48
                        - ddTipo:
                            Control: Classic/Dropdown@2.3.1
                            Properties:
                              BorderColor: =RGBA(228, 232, 240, 1)
                              Height: =40
                              Items: =Choices([@'Solicitudes de Cambios'].Tipo_Cambio)
                              Width: =Parent.Width - 48
                        - ddCategoria:
                            Control: Classic/Dropdown@2.3.1
                            Properties:
                              BorderColor: =RGBA(228, 232, 240, 1)
                              Height: =40
                              Items: =Choices([@'Solicitudes de Cambios'].Categoria_Cambio)
                              Width: =Parent.Width - 48
                        - txtJustificacion:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =RGBA(228, 232, 240, 1)
                              Height: =70
                              Mode: =TextMode.MultiLine
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =Parent.Width - 48
                        - btnEnviarSolicitud:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(130, 195, 65, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =42
                              OnSelect: |-
                                =If(
                                  IsBlank(txtNombre.Text) || IsBlank(txtJustificacion.Text) || IsBlank(ddTipo.Selected.Value),
                                  Notify("Completa los campos obligatorios antes de enviar", NotificationType.Error),
                                  Set(
                                    varRegistro,
                                    Patch(
                                      [@'Solicitudes de Cambios'],
                                      Defaults([@'Solicitudes de Cambios']),
                                      {
                                        Title: txtNombre.Text,
                                        Tipo_Cambio: { Value: ddTipo.Selected.Value },
                                        Justificacion: txtJustificacion.Text,
                                        Categoria_Cambio: { Value: ddCategoria.Selected.Value },
                                        Solicitante: {
                                          '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                          Claims: "i:0#.f|membership|" & User().Email,
                                          DisplayName: User().FullName,
                                          Email: User().Email,
                                          Department: "",
                                          JobTitle: "",
                                          Picture: ""
                                        },
                                        Estado_Aprobacion: { Value: "Pendiente" }
                                      }
                                    )
                                  );
                                  Notify("Solicitud enviada correctamente", NotificationType.Success);
                                  Navigate(scrMisSolicitudes, ScreenTransition.Fade)
                                )
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Text: ="Enviar Solicitud"
                              Width: =180
