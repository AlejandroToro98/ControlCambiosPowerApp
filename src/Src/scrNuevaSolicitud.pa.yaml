# ************************************************************************************************
# Canvas App Screen: scrNuevaSolicitud (Change Management eBFactory)
# ************************************************************************************************
Screens:
  scrNuevaSolicitud:
    Properties:
      Fill: =gblColorBg
      LoadingSpinnerColor: =gblColorPrimary
    Children:
      - ctnH_Main2:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width
          Children:
            - ctnV_Sidebar2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =gblColorPrimary
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  PaddingBottom: =24
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =24
                  Width: =260
                Children:
                  - img_Logo2:
                      Control: Image@2.2.0
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =44
                        Image: '="https://ebfactoryco-my.sharepoint.com/:i:/r/personal/javier_contreras_ebfactory_com/Documents/logo_ebfactory.png"'
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =160
                  - lbl_BrandSub2:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.5)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =20
                        Size: =10
                        Text: ="CHANGE MANAGEMENT"
                  - ctn_Divider2:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(255, 255, 255, 0.1)
                        Height: =1
                        Width: =Parent.Width - 32
                  - btn_NavDashboard2:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrDashboard, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Inicio / Dashboard"
                        Width: =Parent.Width - 32
                  - btn_NavNueva2:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =gblColorSecondary
                        Fill: =RGBA(255, 255, 255, 0.12)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Nuevo registro de cambio"
                        Width: =Parent.Width - 32
                  - btn_NavMisSol2:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrMisSolicitudes, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Mis solicitudes activas"
                        Width: =Parent.Width - 32
                  - btn_NavCierre2:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrEjecucionYCierre, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Ejecución y cierre"
                        Width: =Parent.Width - 32
                  - ctn_UserInfo2:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =50
                        LayoutDirection: =LayoutDirection.Vertical
                        PaddingLeft: =4
                        PaddingTop: =16
                        Width: =Parent.Width - 32
                      Children:
                        - lbl_UserEmail2:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(255, 255, 255, 0.6)
                              Font: =Font.'Segoe UI'
                              Size: =11
                              Text: '="User().Email: " & gblUser.Email'
                              Wrap: =true
            - ctnV_Content2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =gblColorBg
                  FillPortions: =1
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  PaddingBottom: =24
                  PaddingLeft: =If(gblIsMobile, 16, 28)
                  PaddingRight: =If(gblIsMobile, 16, 28)
                  PaddingTop: =24
                Children:
                  - ctnV_Header2:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Height: =65
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                      Children:
                        - lbl_HeaderTitle2:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =gblColorPrimary
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =32
                              Size: =22
                              Text: ="Nuevo registro de cambio"
                        - lbl_HeaderSub2:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(107, 114, 128, 1)
                              Font: =Font.'Segoe UI'
                              Height: =20
                              Size: =12
                              Text: '="Origen de datos en vivo: lista SharePoint ""Solicitudes_Cambio"""'
                  - ctnV_FormCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =gblColorBorder
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Fill: =gblColorCard
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =14
                        PaddingBottom: =24
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =20
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                      Children:
                        - ctnH_FormHeaderRow:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Height: =36
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                            Children:
                              - lbl_FormHeaderTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =gblColorPrimary
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Size: =18
                                    Text: ="Solicitud de cambio"
                              - lbl_FormHeaderChip:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(0, 31, 92, 1)
                                    Fill: =RGBA(239, 246, 255, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =26
                                    Size: =12
                                    Text: ="Estado inicial: Pendiente"
                                    Width: =150
                                    X: =Parent.Width - 150
                        - lbl_FormHeaderSub:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(107, 114, 128, 1)
                              Font: =Font.'Segoe UI'
                              Size: =12
                              Text: ="Los campos marcados con * son obligatorios."
                        - ctnH_Row1:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Height: =65
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                            Children:
                              - ctnV_Col1Left:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                  Children:
                                    - lbl_TipoLabel:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(31, 41, 55, 1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: ="Tipo de cambio *"
                                    - dd_Tipo:
                                        Control: Classic/Dropdown@2.3.1
                                        Properties:
                                          BorderColor: =gblColorBorder
                                          Height: =40
                                          Items: =Choices([@'Solicitudes de Cambios'].Tipo_Cambio)
                                          Width: =Parent.Width
                              - ctnV_Col1Right:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                  Children:
                                    - lbl_NombreLabel:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(31, 41, 55, 1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: ="Nombre del cambio *"
                                    - txt_Nombre:
                                        Control: Classic/TextInput@2.3.2
                                        Properties:
                                          BorderColor: =gblColorBorder
                                          Height: =40
                                          HintText: '="Ej. Migración del clúster de base de datos"'
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Width: =Parent.Width
                        - lbl_JustificacionLabel:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(31, 41, 55, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Size: =13
                              Text: ="Justificación del cambio *"
                        - txt_Justificacion:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =gblColorBorder
                              Height: =70
                              HintText: ="¿Por qué es necesario este cambio?"
                              Mode: =TextMode.MultiLine
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =Parent.Width
                        - ctnH_Row2:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Height: =65
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                            Children:
                              - ctnV_Col2Left:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                  Children:
                                    - lbl_CategoriaLabel:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(31, 41, 55, 1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: ="Categoría del cambio"
                                    - dd_Categoria:
                                        Control: Classic/Dropdown@2.3.1
                                        Properties:
                                          BorderColor: =gblColorBorder
                                          Height: =40
                                          Items: =Choices([@'Solicitudes de Cambios'].Categoria_Cambio)
                                          Width: =Parent.Width
                              - ctnV_Col2Right:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                  Children:
                                    - lbl_ImpactoLabel:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(31, 41, 55, 1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: ="Nivel de impacto"
                                    - dd_Impacto:
                                        Control: Classic/Dropdown@2.3.1
                                        Properties:
                                          BorderColor: =gblColorBorder
                                          Height: =40
                                          Items: =Choices([@'Solicitudes de Cambios'].Nivel_Impacto)
                                          Width: =Parent.Width
                        - lbl_AlcanceLabel:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(31, 41, 55, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Size: =13
                              Text: ="Alcance del cambio"
                        - txt_Alcance:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =gblColorBorder
                              Height: =60
                              Mode: =TextMode.MultiLine
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =Parent.Width
                        - ctnH_Row3:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Height: =85
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                            Children:
                              - ctnV_Col3Left:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                  Children:
                                    - lbl_BeneficioLabel:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(31, 41, 55, 1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: ="Beneficio esperado"
                                    - txt_Beneficio:
                                        Control: Classic/TextInput@2.3.2
                                        Properties:
                                          BorderColor: =gblColorBorder
                                          Height: =60
                                          Mode: =TextMode.MultiLine
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Width: =Parent.Width
                              - ctnV_Col3Right:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                  Children:
                                    - lbl_RiesgosLabel:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(31, 41, 55, 1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Size: =13
                                          Text: ="Riesgos identificados"
                                    - txt_Riesgos:
                                        Control: Classic/TextInput@2.3.2
                                        Properties:
                                          BorderColor: =gblColorBorder
                                          Height: =60
                                          Mode: =TextMode.MultiLine
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Width: =Parent.Width
                        - ctnH_FormFooterActions:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                            Children:
                              - btn_GuardarBorrador:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Color: =RGBA(31, 41, 55, 1)
                                    Fill: =RGBA(243, 244, 246, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =42
                                    OnSelect: =Notify("Borrador guardado", NotificationType.Information)
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Text: ="Guardar borrador"
                                    Width: =160
                              - btn_EnviarSolicitud:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =gblColorSecondary
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =42
                                    OnSelect: |-
                                      =If(
                                        IsBlank(txt_Nombre.Text) || IsBlank(txt_Justificacion.Text) || IsBlank(dd_Tipo.Selected.Value),
                                        Notify("Completa los campos obligatorios antes de enviar", NotificationType.Error),
                                        Set(
                                          varRegistro,
                                          Patch(
                                            [@'Solicitudes de Cambios'],
                                            Defaults([@'Solicitudes de Cambios']),
                                            {
                                              Title: txt_Nombre.Text,
                                              Tipo_Cambio: { Value: dd_Tipo.Selected.Value },
                                              Justificacion: txt_Justificacion.Text,
                                              Categoria_Cambio: { Value: dd_Categoria.Selected.Value },
                                              Alcance: txt_Alcance.Text,
                                              Beneficio_Esperado: txt_Beneficio.Text,
                                              Riesgos_Identificados: txt_Riesgos.Text,
                                              Nivel_Impacto: { Value: dd_Impacto.Selected.Value },
                                              Solicitante: {
                                                '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                Claims: "i:0#.f|membership|" & gblUser.Email,
                                                DisplayName: gblUser.FullName,
                                                Email: gblUser.Email,
                                                Department: "",
                                                JobTitle: "",
                                                Picture: ""
                                              },
                                              Estado_Aprobacion: { Value: "Pendiente" }
                                            }
                                          )
                                        );
                                        Notify("Solicitud CHG-" & varRegistro.ID & " enviada a aprobación correctamente", NotificationType.Success);
                                        Navigate(scrMisSolicitudes, ScreenTransition.Fade)
                                      )
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Text: ="Enviar a aprobación"
                                    Width: =180
