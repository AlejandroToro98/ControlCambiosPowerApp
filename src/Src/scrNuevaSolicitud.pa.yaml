# ************************************************************************************************
# Canvas App Screen: scrNuevaSolicitud (NOWledge Professional Architecture Standard)
# ************************************************************************************************
Screens:
  scrNuevaSolicitud:
    Properties:
      Fill: =gblColorBg
      LoadingSpinnerColor: =gblColorPrimary
    Children:
      - ctnH_Main2:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width
          Children:
            - ctnV_Sidebar2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =gblColorPrimary
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  PaddingBottom: =24
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =24
                  Width: =260
                Children:
                  - img_Logo2:
                      Control: Image@2.2.0
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =44
                        Image: '="https://ebfactoryco-my.sharepoint.com/:i:/r/personal/javier_contreras_ebfactory_com/Documents/logo_ebfactory.png"'
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =160
                  - lbl_BrandSub2:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.5)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =20
                        Size: =10
                        Text: ="CHANGE MANAGEMENT"
                  - ctn_Divider2:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(255, 255, 255, 0.1)
                        Height: =1
                        Width: =Parent.Width - 32
                  - btn_NavDashboard2:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrDashboard, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Inicio / Dashboard"
                        Width: =Parent.Width - 32
                  - btn_NavNueva2:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =gblColorSecondary
                        Fill: =RGBA(255, 255, 255, 0.12)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Nuevo registro de cambio"
                        Width: =Parent.Width - 32
                  - btn_NavMisSol2:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrMisSolicitudes, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Mis solicitudes activas"
                        Width: =Parent.Width - 32
                  - btn_NavCierre2:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrEjecucionYCierre, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Ejecución y cierre"
                        Width: =Parent.Width - 32
                  - ctn_UserInfo2:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =50
                        LayoutDirection: =LayoutDirection.Vertical
                        PaddingLeft: =4
                        PaddingTop: =16
                        Width: =Parent.Width - 32
                      Children:
                        - lbl_UserEmail2:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(255, 255, 255, 0.6)
                              Font: =Font.'Segoe UI'
                              Size: =11
                              Text: '="User().Email: " & gblUser.Email'
                              Wrap: =true
            - ctnV_Content2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =gblColorBg
                  FillPortions: =1
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  PaddingBottom: =24
                  PaddingLeft: =If(gblIsMobile, 16, 28)
                  PaddingRight: =If(gblIsMobile, 16, 28)
                  PaddingTop: =24
                Children:
                  - ctnV_Header2:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Height: =65
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                      Children:
                        - lbl_HeaderTitle2:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =gblColorPrimary
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =32
                              Size: =22
                              Text: ="Nuevo registro de cambio"
                        - lbl_HeaderSub2:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(107, 114, 128, 1)
                              Font: =Font.'Segoe UI'
                              Height: =20
                              Size: =12
                              Text: '="Origen de datos en vivo: lista SharePoint ""Solicitudes_Cambio"""'
                  - ctnV_FormCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =gblColorBorder
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Fill: =gblColorCard
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =14
                        PaddingBottom: =24
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =20
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                      Children:
                        - txt_Nombre:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =gblColorBorder
                              Height: =40
                              HintText: '="Ej. Migración del clúster de base de datos"'
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =Parent.Width - 48
                        - dd_Tipo:
                            Control: Classic/Dropdown@2.3.1
                            Properties:
                              BorderColor: =gblColorBorder
                              Height: =40
                              Items: =Choices([@'Solicitudes de Cambios'].Tipo_Cambio)
                              Width: =Parent.Width - 48
                        - dd_Categoria:
                            Control: Classic/Dropdown@2.3.1
                            Properties:
                              BorderColor: =gblColorBorder
                              Height: =40
                              Items: =Choices([@'Solicitudes de Cambios'].Categoria_Cambio)
                              Width: =Parent.Width - 48
                        - txt_Justificacion:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =gblColorBorder
                              Height: =70
                              HintText: ="¿Por qué es necesario este cambio?"
                              Mode: =TextMode.MultiLine
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =Parent.Width - 48
                        - btn_EnviarSolicitud:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =gblColorSecondary
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =42
                              OnSelect: |-
                                =If(
                                  IsBlank(txt_Nombre.Text) || IsBlank(txt_Justificacion.Text) || IsBlank(dd_Tipo.Selected.Value),
                                  Notify("Completa los campos obligatorios antes de enviar", NotificationType.Error),
                                  Set(
                                    varRegistro,
                                    Patch(
                                      [@'Solicitudes de Cambios'],
                                      Defaults([@'Solicitudes de Cambios']),
                                      {
                                        Title: txt_Nombre.Text,
                                        Tipo_Cambio: { Value: dd_Tipo.Selected.Value },
                                        Justificacion: txt_Justificacion.Text,
                                        Categoria_Cambio: { Value: dd_Categoria.Selected.Value },
                                        Solicitante: {
                                          '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                          Claims: "i:0#.f|membership|" & gblUser.Email,
                                          DisplayName: gblUser.FullName,
                                          Email: gblUser.Email,
                                          Department: "",
                                          JobTitle: "",
                                          Picture: ""
                                        },
                                        Estado_Aprobacion: { Value: "Pendiente" }
                                      }
                                    )
                                  );
                                  Notify("Solicitud CHG-" & varRegistro.ID & " enviada a aprobación correctamente", NotificationType.Success);
                                  Navigate(scrMisSolicitudes, ScreenTransition.Fade)
                                )
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Text: ="Enviar a aprobación"
                              Width: =180
