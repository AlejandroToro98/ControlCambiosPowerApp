# ************************************************************************************************
# Canvas App Screen: scrMisSolicitudes (Change Management eBFactory)
# ************************************************************************************************
Screens:
  scrMisSolicitudes:
    Properties:
      Fill: =gblColorBg
      LoadingSpinnerColor: =gblColorPrimary
      OnVisible: =Refresh([@'Solicitudes de Cambios'])
    Children:
      - ctnH_Main3:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width
          Children:
            - ctnV_Sidebar3:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =gblColorPrimary
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  PaddingBottom: =24
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =24
                  Width: =260
                Children:
                  - img_Logo3:
                      Control: Image@2.2.0
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =44
                        Image: '="https://ebfactoryco-my.sharepoint.com/:i:/r/personal/javier_contreras_ebfactory_com/Documents/logo_ebfactory.png"'
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =160
                  - lbl_BrandSub3:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.5)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =20
                        Size: =10
                        Text: ="CHANGE MANAGEMENT"
                  - ctn_Divider3:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(255, 255, 255, 0.1)
                        Height: =1
                        Width: =Parent.Width - 32
                  - btn_NavDashboard3:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrDashboard, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Inicio / Dashboard"
                        Width: =Parent.Width - 32
                  - btn_NavNueva3:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrNuevaSolicitud, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Nuevo registro de cambio"
                        Width: =Parent.Width - 32
                  - btn_NavMisSol3:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =gblColorSecondary
                        Fill: =RGBA(255, 255, 255, 0.12)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Mis solicitudes activas"
                        Width: =Parent.Width - 32
                  - btn_NavCierre3:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrEjecucionYCierre, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Ejecución y cierre"
                        Width: =Parent.Width - 32
                  - ctn_UserInfo3:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =50
                        LayoutDirection: =LayoutDirection.Vertical
                        PaddingLeft: =4
                        PaddingTop: =16
                        Width: =Parent.Width - 32
                      Children:
                        - lbl_UserEmail3:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(255, 255, 255, 0.6)
                              Font: =Font.'Segoe UI'
                              Size: =11
                              Text: '="User().Email: " & gblUser.Email'
                              Wrap: =true
            - ctnV_Content3:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =gblColorBg
                  FillPortions: =1
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  PaddingBottom: =24
                  PaddingLeft: =If(gblIsMobile, 16, 28)
                  PaddingRight: =If(gblIsMobile, 16, 28)
                  PaddingTop: =24
                Children:
                  - ctnV_Header3:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Height: =65
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                      Children:
                        - lbl_HeaderTitle3:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =gblColorPrimary
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =32
                              Size: =22
                              Text: ="Mis solicitudes activas"
                        - lbl_HeaderSub3:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(107, 114, 128, 1)
                              Font: =Font.'Segoe UI'
                              Height: =20
                              Size: =12
                              Text: '="Origen de datos en vivo: lista SharePoint ""Solicitudes_Cambio"""'
                  - gal_MisSolicitudes:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_ThreeTextVariant_ver5.0
                      Properties:
                        DelayItemLoading: =true
                        Height: =Parent.Height - 110
                        Items: =Filter([@'Solicitudes de Cambios'], Solicitante.Email = gblUser.Email)
                        LoadingSpinner: =LoadingSpinner.Data
                        TemplatePadding: =10
                        TemplateSize: =140
                        Width: =Parent.Width
                      Children:
                        - ctnV_ItemCard:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =gblColorBorder
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Fill: =gblColorCard
                              Height: =Parent.TemplateHeight - 12
                              LayoutDirection: =LayoutDirection.Vertical
                              PaddingBottom: =16
                              PaddingLeft: =20
                              PaddingRight: =20
                              PaddingTop: =16
                              RadiusBottomLeft: =16
                              RadiusBottomRight: =16
                              RadiusTopLeft: =16
                              RadiusTopRight: =16
                              Width: =Parent.TemplateWidth
                            Children:
                              - lbl_MisSolTicket:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(107, 114, 128, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =11
                                    Text: ="CHG-" & ThisItem.ID
                              - lbl_MisSolTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =gblColorPrimary
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Size: =16
                                    Text: =ThisItem.Title
                              - lbl_MisSolSub:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(107, 114, 128, 1)
                                    Font: =Font.'Segoe UI'
                                    Size: =12
                                    Text: '="Tipo: " & ThisItem.Tipo_Cambio.Value & " · Creado el " & Text(ThisItem.Created, "dd/mm/yyyy")'
                              - lbl_MisSolStateChip:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: |-
                                      =Switch(
                                        ThisItem.Estado_Aprobacion.Value,
                                        "Pendiente", RGBA(146, 110, 20, 1),
                                        "Aprobado", RGBA(78, 131, 32, 1),
                                        "Rechazado", RGBA(178, 42, 42, 1),
                                        RGBA(107, 114, 128, 1)
                                      )
                                    Fill: |-
                                      =Switch(
                                        ThisItem.Estado_Aprobacion.Value,
                                        "Pendiente", RGBA(201, 162, 39, 0.15),
                                        "Aprobado", RGBA(130, 195, 65, 0.15),
                                        "Rechazado", RGBA(214, 69, 69, 0.15),
                                        RGBA(243, 244, 246, 1)
                                      )
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    Size: =12
                                    Text: =ThisItem.Estado_Aprobacion.Value
                                    Width: =110
                                    X: =Parent.Width - 140
                                    Y: =16
