# ************************************************************************************************
# Canvas App Screen: scrMisSolicitudes (Change Management eBFactory)
# ************************************************************************************************
Screens:
  scrMisSolicitudes:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
      LoadingSpinnerColor: =RGBA(0, 43, 127, 1)
      OnVisible: =Refresh([@'Solicitudes de Cambios'])
    Children:
      - conMainLayout3:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width
          Children:
            - conSidebar3:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(0, 43, 127, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  PaddingBottom: =24
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =24
                  Width: =260
                Children:
                  - lblBrandTitle3:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Size: =18
                        Text: ="eBFactory"
                  - lblBrandSub3:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.7)
                        Font: =Font.'Segoe UI'
                        Height: =20
                        Size: =12
                        Text: ="Control de Cambios"
                  - conDivider3:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(255, 255, 255, 0.15)
                        Height: =1
                        Width: =Parent.Width - 40
                  - btnNavDashboard3:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.85)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrDashboard, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="📊 Inicio / Dashboard"
                        Width: =Parent.Width - 40
                  - btnNavNueva3:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.85)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrNuevaSolicitud, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="➕ Nueva Solicitud"
                        Width: =Parent.Width - 40
                  - btnNavMisSol3:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(130, 195, 65, 1)
                        Fill: =RGBA(130, 195, 65, 0.2)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="📋 Mis Solicitudes"
                        Width: =Parent.Width - 40
                  - btnNavCierre3:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.85)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrEjecucionYCierre, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="✅ Ejecución y Cierre"
                        Width: =Parent.Width - 40
            - conWorkArea3:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(245, 247, 250, 1)
                  FillPortions: =1
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =20
                  PaddingBottom: =24
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =24
                Children:
                  - conHeader3:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =70
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        PaddingLeft: =20
                        PaddingRight: =20
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - lblHeaderTitle3:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(0, 43, 127, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Size: =20
                              Text: ="Mis Solicitudes de Cambio"
                  - conMisSolCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        PaddingBottom: =16
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =16
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - galMisSolicitudes:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_ThreeTextVariant_ver5.0
                            Properties:
                              DelayItemLoading: =true
                              Height: =520
                              Items: =Filter([@'Solicitudes de Cambios'], Solicitante.Email = User().Email)
                              LoadingSpinner: =LoadingSpinner.Data
                              TemplatePadding: =10
                              TemplateSize: =100
                              Width: =Parent.Width - 40
                            Children:
                              - lblMisSolTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(31, 41, 55, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Size: =15
                                    Text: =ThisItem.Title
                                    X: =12
                                    Y: =12
                              - lblMisSolSub:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(107, 114, 128, 1)
                                    Font: =Font.'Segoe UI'
                                    Size: =12
                                    Text: '="CHG-" & ThisItem.ID & " · " & ThisItem.Tipo_Cambio.Value & " · Creado el " & Text(ThisItem.Created, "dd/mm/yyyy hh:mm")'
                                    X: =12
                                    Y: =36
                              - lblMotivoRechazo:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(185, 28, 28, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: '="Motivo de Rechazo: " & ThisItem.Motivo_Rechazo'
                                    Visible: =ThisItem.Estado_Aprobacion.Value = "Rechazado"
                                    X: =12
                                    Y: =60
                              - lblMisSolStateChip:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: |-
                                      =Switch(
                                        ThisItem.Estado_Aprobacion.Value,
                                        "Pendiente", RGBA(146, 110, 20, 1),
                                        "Aprobado", RGBA(22, 101, 52, 1),
                                        "Rechazado", RGBA(153, 27, 27, 1),
                                        RGBA(107, 114, 128, 1)
                                      )
                                    Fill: |-
                                      =Switch(
                                        ThisItem.Estado_Aprobacion.Value,
                                        "Pendiente", RGBA(253, 230, 138, 0.5),
                                        "Aprobado", RGBA(187, 247, 208, 0.5),
                                        "Rechazado", RGBA(254, 202, 202, 0.5),
                                        RGBA(243, 244, 246, 1)
                                      )
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =30
                                    Size: =12
                                    Text: =ThisItem.Estado_Aprobacion.Value
                                    Width: =120
                                    X: =Parent.TemplateWidth - 140
                                    Y: =24
