# ************************************************************************************************
# Canvas App Screen Base: scrMisSolicitudes
# ************************************************************************************************
Screens:
  scrMisSolicitudes:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
      LoadingSpinnerColor: =RGBA(0, 43, 127, 1)
      OnVisible: =Refresh([@'Solicitudes de Cambios'])
    Children:
      - conMainLayout3:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width
          Children:
            - conSidebar3:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(0, 43, 127, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  PaddingBottom: =24
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =24
                  Width: =260
                Children:
                  - btnNavDashboard3:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrDashboard, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Inicio / Dashboard"
                        Width: =Parent.Width - 32
                  - btnNavNueva3:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrNuevaSolicitud, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Nueva Solicitud"
                        Width: =Parent.Width - 32
                  - btnNavMisSol3:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(130, 195, 65, 1)
                        Fill: =RGBA(255, 255, 255, 0.12)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Mis Solicitudes"
                        Width: =Parent.Width - 32
                  - btnNavCierre3:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrEjecucionYCierre, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Ejecución y Cierre"
                        Width: =Parent.Width - 32
            - conWorkArea3:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(245, 247, 250, 1)
                  FillPortions: =1
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  PaddingBottom: =24
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =24
                Children:
                  - galMisSolicitudes:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_ThreeTextVariant_ver5.0
                      Properties:
                        DelayItemLoading: =true
                        Height: =Parent.Height - 60
                        Items: =Filter([@'Solicitudes de Cambios'], Solicitante.Email = User().Email)
                        LoadingSpinner: =LoadingSpinner.Data
                        TemplatePadding: =10
                        TemplateSize: =100
                        Width: =Parent.Width
                      Children:
                        - lblMisSolTitle:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(0, 43, 127, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Size: =16
                              Text: =ThisItem.Title
                              X: =12
                              Y: =12
                        - lblMisSolStateChip:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: |-
                                =Switch(
                                  ThisItem.Estado_Aprobacion.Value,
                                  "Pendiente", RGBA(146, 110, 20, 1),
                                  "Aprobado", RGBA(78, 131, 32, 1),
                                  "Rechazado", RGBA(178, 42, 42, 1),
                                  RGBA(107, 114, 128, 1)
                                )
                              Fill: |-
                                =Switch(
                                  ThisItem.Estado_Aprobacion.Value,
                                  "Pendiente", RGBA(201, 162, 39, 0.15),
                                  "Aprobado", RGBA(130, 195, 65, 0.15),
                                  "Rechazado", RGBA(214, 69, 69, 0.15),
                                  RGBA(243, 244, 246, 1)
                                )
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              Size: =12
                              Text: =ThisItem.Estado_Aprobacion.Value
                              Width: =110
                              X: =Parent.TemplateWidth - 130
                              Y: =12
