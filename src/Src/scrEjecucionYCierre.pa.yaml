# ************************************************************************************************
# Canvas App Screen: scrEjecucionYCierre (Change Management eBFactory)
# ************************************************************************************************
Screens:
  scrEjecucionYCierre:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
      LoadingSpinnerColor: =RGBA(0, 43, 127, 1)
      OnVisible: =Refresh([@'Solicitudes de Cambios'])
    Children:
      - conMainLayout4:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width
          Children:
            - conSidebar4:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(0, 43, 127, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  PaddingBottom: =24
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =24
                  Width: =260
                Children:
                  - lblBrandTitle4:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Size: =18
                        Text: ="eBFactory"
                  - lblBrandSub4:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.7)
                        Font: =Font.'Segoe UI'
                        Height: =20
                        Size: =12
                        Text: ="Control de Cambios"
                  - conDivider4:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(255, 255, 255, 0.15)
                        Height: =1
                        Width: =Parent.Width - 40
                  - btnNavDashboard4:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.85)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrDashboard, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="📊 Inicio / Dashboard"
                        Width: =Parent.Width - 40
                  - btnNavNueva4:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.85)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrNuevaSolicitud, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="➕ Nueva Solicitud"
                        Width: =Parent.Width - 40
                  - btnNavMisSol4:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.85)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrMisSolicitudes, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="📋 Mis Solicitudes"
                        Width: =Parent.Width - 40
                  - btnNavCierre4:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(130, 195, 65, 1)
                        Fill: =RGBA(130, 195, 65, 0.2)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="✅ Ejecución y Cierre"
                        Width: =Parent.Width - 40
            - conWorkArea4:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(245, 247, 250, 1)
                  FillPortions: =1
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =20
                  PaddingBottom: =24
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =24
                Children:
                  - conHeader4:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =70
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        PaddingLeft: =20
                        PaddingRight: =20
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - lblHeaderTitle4:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(0, 43, 127, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Size: =20
                              Text: ="Ejecución y Cierre de Cambios Aprobados"
                  - conCierreCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        PaddingBottom: =16
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =16
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - galAprobados:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_ThreeTextVariant_ver5.0
                            Properties:
                              DelayItemLoading: =true
                              Height: =520
                              Items: =Filter([@'Solicitudes de Cambios'], Estado_Aprobacion.Value = "Aprobado")
                              LoadingSpinner: =LoadingSpinner.Data
                              OnSelect: |-
                                =Set(varTicketSeleccionado, ThisItem);
                                Set(varPanelDetalle, true)
                              TemplatePadding: =10
                              TemplateSize: =85
                              Width: =Parent.Width - 40
                            Children:
                              - lblAprTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(31, 41, 55, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Size: =15
                                    Text: =ThisItem.Title
                                    X: =12
                                    Y: =12
                              - lblAprSub:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(107, 114, 128, 1)
                                    Font: =Font.'Segoe UI'
                                    Size: =12
                                    Text: '="CHG-" & ThisItem.ID & " · Solicitante: " & ThisItem.Solicitante.DisplayName & " · " & ThisItem.Tipo_Cambio.Value'
                                    X: =12
                                    Y: =36
                              - btnCerrarItem:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =RGBA(130, 195, 65, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =34
                                    OnSelect: |-
                                      =Set(varTicketSeleccionado, ThisItem);
                                      Set(varPanelDetalle, true)
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =12
                                    Text: ="Validar y Cerrar"
                                    Width: =140
                                    X: =Parent.TemplateWidth - 160
                                    Y: =20
            - conPanelDetalle:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Vertical
                  PaddingBottom: =24
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =24
                  Visible: =varPanelDetalle
                  Width: =380
                Children:
                  - lblPanelTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(0, 43, 127, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        Size: =16
                        Text: ="Cierre de Solicitud CHG-" & varTicketSeleccionado.ID
                  - lblPanelSubTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(31, 41, 55, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        Size: =13
                        Text: =varTicketSeleccionado.Title
                  - lblComentariosLabel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(31, 41, 55, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Size: =12
                        Text: ="Comentarios de Ejecución y Cierre *"
                  - txtComentariosCierre:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(228, 232, 240, 1)
                        Height: =100
                        HintText: ="Registra las evidencias o notas finales de la ejecución..."
                        Mode: =TextMode.MultiLine
                        Width: =Parent.Width - 40
                  - btnConfirmarCierre:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(130, 195, 65, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        OnSelect: |-
                          =If(
                            IsBlank(txtComentariosCierre.Text),
                            Notify("Registra los comentarios de ejecución antes de cerrar", NotificationType.Error),
                            Patch(
                              [@'Solicitudes de Cambios'],
                              LookUp([@'Solicitudes de Cambios'], ID = varTicketSeleccionado.ID),
                              {
                                Estado_Aprobacion: { Value: "Cerrado" },
                                Comentarios_Cierre: txtComentariosCierre.Text,
                                Fecha_Cierre: Now()
                              }
                            );
                            Refresh([@'Solicitudes de Cambios']);
                            Set(varPanelDetalle, false);
                            Notify("Cambio CHG-" & varTicketSeleccionado.ID & " cerrado correctamente", NotificationType.Success)
                          )
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="✅ Confirmar y Cerrar Cambio"
                        Width: =Parent.Width - 40
                  - btnCancelarPanel:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(107, 114, 128, 1)
                        Fill: =RGBA(243, 244, 246, 1)
                        Font: =Font.'Segoe UI'
                        Height: =36
                        OnSelect: =Set(varPanelDetalle, false)
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Text: ="Cancelar"
                        Width: =Parent.Width - 40
