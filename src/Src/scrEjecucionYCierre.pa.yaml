# ************************************************************************************************
# Canvas App Screen: scrEjecucionYCierre (Change Management eBFactory)
# ************************************************************************************************
Screens:
  scrEjecucionYCierre:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
      LoadingSpinnerColor: =RGBA(0, 43, 127, 1)
      OnVisible: =Refresh([@'Solicitudes de Cambios'])
    Children:
      - conMainLayout4:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width
          Children:
            - conSidebar4:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(0, 43, 127, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  PaddingBottom: =20
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =24
                  Width: =260
                Children:
                  - imgLogo4:
                      Control: Image@2.2.0
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =44
                        Image: '="https://ebfactoryco-my.sharepoint.com/:i:/r/personal/javier_contreras_ebfactory_com/Documents/logo_ebfactory.png"'
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =160
                  - lblBrandSub4:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.5)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =20
                        Size: =10
                        Text: ="CHANGE MANAGEMENT"
                  - conDivider4:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(255, 255, 255, 0.1)
                        Height: =1
                        Width: =Parent.Width - 32
                  - btnNavDashboard4:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =42
                        OnSelect: =Navigate(scrDashboard, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Inicio / Dashboard"
                        Width: =Parent.Width - 32
                  - btnNavNueva4:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =42
                        OnSelect: =Navigate(scrNuevaSolicitud, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Nuevo registro de cambio"
                        Width: =Parent.Width - 32
                  - btnNavMisSol4:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =42
                        OnSelect: =Navigate(scrMisSolicitudes, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Mis solicitudes activas"
                        Width: =Parent.Width - 32
                  - btnNavCierre4:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(130, 195, 65, 1)
                        Fill: =RGBA(255, 255, 255, 0.1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =42
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Ejecución y cierre"
                        Width: =Parent.Width - 32
                  - conUserInfo4:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =60
                        LayoutDirection: =LayoutDirection.Vertical
                        PaddingLeft: =4
                        PaddingTop: =12
                        Width: =Parent.Width - 32
                      Children:
                        - lblUserEmail4:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(255, 255, 255, 0.6)
                              Font: =Font.'Segoe UI'
                              Size: =11
                              Text: '="User().Email: " & User().Email'
            - conWorkArea4:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(245, 247, 250, 1)
                  FillPortions: =1
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  PaddingBottom: =24
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =24
                Children:
                  - conHeader4:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Height: =50
                        LayoutDirection: =LayoutDirection.Vertical
                      Children:
                        - lblHeaderTitle4:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(0, 43, 127, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Size: =22
                              Text: ="Ejecución y cierre"
                        - lblHeaderSub4:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(107, 114, 128, 1)
                              Font: =Font.'Segoe UI'
                              Size: =12
                              Text: '="Origen de datos en vivo: lista SharePoint ""Solicitudes_Cambio"""'
                  - galAprobados:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_ThreeTextVariant_ver5.0
                      Properties:
                        DelayItemLoading: =true
                        Height: =Parent.Height - 100
                        Items: =Filter([@'Solicitudes de Cambios'], Estado_Aprobacion.Value = "Aprobado")
                        LoadingSpinner: =LoadingSpinner.Data
                        OnSelect: |-
                          =Set(varTicketSeleccionado, ThisItem);
                          Set(varPanelDetalle, true)
                        TemplatePadding: =10
                        TemplateSize: =120
                        Width: =Parent.Width
                      Children:
                        - conItemAprCard:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(228, 232, 240, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =Parent.TemplateHeight - 10
                              LayoutDirection: =LayoutDirection.Vertical
                              PaddingBottom: =14
                              PaddingLeft: =20
                              PaddingRight: =20
                              PaddingTop: =14
                              RadiusBottomLeft: =16
                              RadiusBottomRight: =16
                              RadiusTopLeft: =16
                              RadiusTopRight: =16
                              Width: =Parent.TemplateWidth
                            Children:
                              - lblAprTicket:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(107, 114, 128, 1)
                                    Font: =Font.'Segoe UI'
                                    Size: =11
                                    Text: ="CHG-" & ThisItem.ID
                              - lblAprTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(0, 43, 127, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Size: =16
                                    Text: =ThisItem.Title
                              - lblAprSub:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(107, 114, 128, 1)
                                    Font: =Font.'Segoe UI'
                                    Size: =12
                                    Text: '="Ventana: " & Text(ThisItem.Fecha_Cambio, "yyyy-mm-dd") & " · " & ThisItem.Tipo_Cambio.Value'
            - conPanelDetalle:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(228, 232, 240, 1)
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =1
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                  Visible: =varPanelDetalle
                  Width: =420
                Children:
                  - lblPanelTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(0, 43, 127, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Size: =17
                        Text: =varTicketSeleccionado.Title
                  - lblTicketInfo:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(107, 114, 128, 1)
                        Font: =Font.'Segoe UI'
                        Size: =12
                        Text: ="TICKET: CHG-" & varTicketSeleccionado.ID
                  - lblTipoInfo:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(31, 41, 55, 1)
                        Font: =Font.'Segoe UI'
                        Size: =12
                        Text: ="TIPO: " & varTicketSeleccionado.Tipo_Cambio.Value
                  - lblComentariosLabel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(31, 41, 55, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Size: =13
                        Text: ="Comentarios y observaciones finales de la ejecución"
                  - txtComentariosCierre:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(228, 232, 240, 1)
                        Height: =120
                        HintText: ="Describe el resultado de la ejecución en producción..."
                        Mode: =TextMode.MultiLine
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width - 48
                  - btnConfirmarCierre:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(130, 195, 65, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        OnSelect: |-
                          =If(
                            IsBlank(txtComentariosCierre.Text),
                            Notify("Registra los comentarios de ejecución antes de cerrar", NotificationType.Error),
                            Patch(
                              [@'Solicitudes de Cambios'],
                              LookUp([@'Solicitudes de Cambios'], ID = varTicketSeleccionado.ID),
                              {
                                Estado_Aprobacion: { Value: "Cerrado" },
                                Comentarios_Cierre: txtComentariosCierre.Text,
                                Fecha_Cierre: Now()
                              }
                            );
                            Refresh([@'Solicitudes de Cambios']);
                            Set(varPanelDetalle, false);
                            Notify("Cambio CHG-" & varTicketSeleccionado.ID & " cerrado correctamente", NotificationType.Success)
                          )
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Validar y marcar como Cerrado"
                        Width: =Parent.Width - 48
