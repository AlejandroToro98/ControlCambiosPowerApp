# ************************************************************************************************
# Canvas App Screen: scrEjecucionYCierre (NOWledge Professional Architecture Standard)
# ************************************************************************************************
Screens:
  scrEjecucionYCierre:
    Properties:
      Fill: =gblColorBg
      LoadingSpinnerColor: =gblColorPrimary
      OnVisible: =Refresh([@'Solicitudes de Cambios'])
    Children:
      - ctnH_Main4:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width
          Children:
            - ctnV_Sidebar4:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =gblColorPrimary
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  PaddingBottom: =24
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =24
                  Width: =260
                Children:
                  - img_Logo4:
                      Control: Image@2.2.0
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =44
                        Image: '="https://ebfactoryco-my.sharepoint.com/:i:/r/personal/javier_contreras_ebfactory_com/Documents/logo_ebfactory.png"'
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =160
                  - lbl_BrandSub4:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.5)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =20
                        Size: =10
                        Text: ="CHANGE MANAGEMENT"
                  - ctn_Divider4:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(255, 255, 255, 0.1)
                        Height: =1
                        Width: =Parent.Width - 32
                  - btn_NavDashboard4:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrDashboard, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Inicio / Dashboard"
                        Width: =Parent.Width - 32
                  - btn_NavNueva4:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrNuevaSolicitud, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Nuevo registro de cambio"
                        Width: =Parent.Width - 32
                  - btn_NavMisSol4:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrMisSolicitudes, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Mis solicitudes activas"
                        Width: =Parent.Width - 32
                  - btn_NavCierre4:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =gblColorSecondary
                        Fill: =RGBA(255, 255, 255, 0.12)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Ejecución y cierre"
                        Width: =Parent.Width - 32
                  - ctn_UserInfo4:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =50
                        LayoutDirection: =LayoutDirection.Vertical
                        PaddingLeft: =4
                        PaddingTop: =16
                        Width: =Parent.Width - 32
                      Children:
                        - lbl_UserEmail4:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(255, 255, 255, 0.6)
                              Font: =Font.'Segoe UI'
                              Size: =11
                              Text: '="User().Email: " & gblUser.Email'
                              Wrap: =true
            - ctnV_Content4:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =gblColorBg
                  FillPortions: =1
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  PaddingBottom: =24
                  PaddingLeft: =If(gblIsMobile, 16, 28)
                  PaddingRight: =If(gblIsMobile, 16, 28)
                  PaddingTop: =24
                Children:
                  - ctnV_Header4:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Height: =65
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                      Children:
                        - lbl_HeaderTitle4:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =gblColorPrimary
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =32
                              Size: =22
                              Text: ="Ejecución y cierre"
                        - lbl_HeaderSub4:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(107, 114, 128, 1)
                              Font: =Font.'Segoe UI'
                              Height: =20
                              Size: =12
                              Text: '="Origen de datos en vivo: lista SharePoint ""Solicitudes_Cambio"""'
                  - gal_Aprobados:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_ThreeTextVariant_ver5.0
                      Properties:
                        DelayItemLoading: =true
                        Height: =Parent.Height - 110
                        Items: =Filter([@'Solicitudes de Cambios'], Estado_Aprobacion.Value = "Aprobado")
                        LoadingSpinner: =LoadingSpinner.Data
                        OnSelect: |-
                          =Set(gblSelectedRecord, ThisItem);
                          Set(locPanelDetalle, true)
                        TemplatePadding: =10
                        TemplateSize: =80
                        Width: =Parent.Width
                      Children:
                        - lbl_AprTitle:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblColorPrimary
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Size: =16
                              Text: =ThisItem.Title
                              X: =12
                              Y: =12
                        - btn_CerrarItem:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =gblColorSecondary
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =34
                              OnSelect: |-
                                =Set(gblSelectedRecord, ThisItem);
                                Set(locPanelDetalle, true)
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Size: =12
                              Text: ="Cerrar"
                              Width: =100
                              X: =Parent.TemplateWidth - 120
                              Y: =12
            - ctnV_PanelDetalle:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =gblColorBorder
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =1
                  Fill: =gblColorCard
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                  Visible: =locPanelDetalle
                  Width: =400
                Children:
                  - lbl_PanelTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblColorPrimary
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Size: =16
                        Text: =gblSelectedRecord.Title
                  - txt_ComentariosCierre:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =gblColorBorder
                        Height: =120
                        Mode: =TextMode.MultiLine
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width - 48
                  - btn_ConfirmarCierre:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =gblColorSecondary
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        OnSelect: |-
                          =If(
                            IsBlank(txt_ComentariosCierre.Text),
                            Notify("Registra los comentarios de ejecución antes de cerrar", NotificationType.Error),
                            Patch(
                              [@'Solicitudes de Cambios'],
                              LookUp([@'Solicitudes de Cambios'], ID = gblSelectedRecord.ID),
                              {
                                Estado_Aprobacion: { Value: "Cerrado" },
                                Comentarios_Cierre: txt_ComentariosCierre.Text,
                                Fecha_Cierre: Now()
                              }
                            );
                            Refresh([@'Solicitudes de Cambios']);
                            Set(locPanelDetalle, false);
                            Notify("Cambio cerrado correctamente", NotificationType.Success)
                          )
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Marcar como Cerrado"
                        Width: =Parent.Width - 48
