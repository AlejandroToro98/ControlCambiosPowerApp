# ************************************************************************************************
# Canvas App Screen Base: scrEjecucionYCierre
# ************************************************************************************************
Screens:
  scrEjecucionYCierre:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
      LoadingSpinnerColor: =RGBA(0, 43, 127, 1)
      OnVisible: =Refresh([@'Solicitudes de Cambios'])
    Children:
      - conMainLayout4:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width
          Children:
            - conSidebar4:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(0, 43, 127, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  PaddingBottom: =24
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =24
                  Width: =260
                Children:
                  - btnNavDashboard4:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrDashboard, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Inicio / Dashboard"
                        Width: =Parent.Width - 32
                  - btnNavNueva4:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrNuevaSolicitud, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Nueva Solicitud"
                        Width: =Parent.Width - 32
                  - btnNavMisSol4:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        OnSelect: =Navigate(scrMisSolicitudes, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Mis Solicitudes"
                        Width: =Parent.Width - 32
                  - btnNavCierre4:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(130, 195, 65, 1)
                        Fill: =RGBA(255, 255, 255, 0.12)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Ejecución y Cierre"
                        Width: =Parent.Width - 32
            - conWorkArea4:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(245, 247, 250, 1)
                  FillPortions: =1
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  PaddingBottom: =24
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =24
                Children:
                  - galAprobados:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_ThreeTextVariant_ver5.0
                      Properties:
                        DelayItemLoading: =true
                        Height: =Parent.Height - 60
                        Items: =Filter([@'Solicitudes de Cambios'], Estado_Aprobacion.Value = "Aprobado")
                        LoadingSpinner: =LoadingSpinner.Data
                        OnSelect: |-
                          =Set(varTicketSeleccionado, ThisItem);
                          Set(varPanelDetalle, true)
                        TemplatePadding: =10
                        TemplateSize: =80
                        Width: =Parent.Width
                      Children:
                        - lblAprTitle:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(0, 43, 127, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Size: =16
                              Text: =ThisItem.Title
                              X: =12
                              Y: =12
                        - btnCerrarItem:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(130, 195, 65, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =34
                              OnSelect: |-
                                =Set(varTicketSeleccionado, ThisItem);
                                Set(varPanelDetalle, true)
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Size: =12
                              Text: ="Cerrar"
                              Width: =100
                              X: =Parent.TemplateWidth - 120
                              Y: =12
            - conPanelDetalle:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(228, 232, 240, 1)
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =1
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                  Visible: =varPanelDetalle
                  Width: =400
                Children:
                  - lblPanelTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(0, 43, 127, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Size: =16
                        Text: =varTicketSeleccionado.Title
                  - txtComentariosCierre:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(228, 232, 240, 1)
                        Height: =120
                        Mode: =TextMode.MultiLine
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width - 48
                  - btnConfirmarCierre:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(130, 195, 65, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        OnSelect: |-
                          =If(
                            IsBlank(txtComentariosCierre.Text),
                            Notify("Registra los comentarios de ejecución antes de cerrar", NotificationType.Error),
                            Patch(
                              [@'Solicitudes de Cambios'],
                              LookUp([@'Solicitudes de Cambios'], ID = varTicketSeleccionado.ID),
                              {
                                Estado_Aprobacion: { Value: "Cerrado" },
                                Comentarios_Cierre: txtComentariosCierre.Text,
                                Fecha_Cierre: Now()
                              }
                            );
                            Refresh([@'Solicitudes de Cambios']);
                            Set(varPanelDetalle, false);
                            Notify("Cambio cerrado correctamente", NotificationType.Success)
                          )
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Marcar como Cerrado"
                        Width: =Parent.Width - 48
